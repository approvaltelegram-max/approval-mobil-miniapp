<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Pengajuan Pemakaian Mobil</title>
  <style>
    :root { --bg: var(--tg-theme-bg-color, #f4f6f8); --fg: var(--tg-theme-text-color, #17212b); --muted: var(--tg-theme-hint-color, #718096); --card: var(--tg-theme-secondary-bg-color, #fff); --accent: var(--tg-theme-button-color, #2481cc); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px 16px 30px; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, sans-serif; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { margin: 4px 0 6px; font-size: 22px; }
    .intro { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    form.card { padding: 18px; border-radius: 16px; background: var(--card); }
    label { display: block; margin: 0 0 14px; font-weight: 600; font-size: 14px; }
    input, select, textarea { display: block; width: 100%; margin-top: 6px; padding: 12px; border: 1px solid #ccd3dc; border-radius: 10px; background: var(--bg); color: var(--fg); font: inherit; font-weight: 400; }
    textarea { min-height: 84px; resize: vertical; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    button { display: block; width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 11px; background: var(--accent); color: var(--tg-theme-button-text-color, #fff); font: inherit; font-weight: 700; }
    button:disabled { opacity: .55; }
    #message { margin: 14px 0 0; font-size: 14px; }
    #message.error { color: #d23f31; }
    #message.success { color: #16834a; }
    #km-hint { display: block; margin: -8px 0 14px; color: var(--muted); font-size: 12px; }
    @media (max-width: 420px) { .grid { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <main>
    <h1 id="page-title">Pengajuan Pemakaian Mobil</h1>
    <p class="intro" id="page-intro">Isi data perjalanan, lalu periksa sebelum dikirim untuk persetujuan.</p>
    <form class="card" id="request-form" hidden>
      <label>Nama pemohon<input name="name" maxlength="100" required autocomplete="name"></label>
      <div class="grid">
        <label>Tanggal mulai<input name="startDate" type="date" required></label>
        <label>Jam mulai<input name="startTime" type="time" required></label>
      </div>
      <label>Tujuan<input name="destination" maxlength="200" required placeholder="Contoh: Kantor cabang pusat"></label>
      <label>Keperluan<textarea name="purpose" maxlength="1000" required placeholder="Jelaskan keperluan perjalanan"></textarea></label>
      <label>Mobil yang diminta<select id="car" name="car" required disabled><option value="">Memuat daftar mobil...</option></select></label>
      <label>KM Awal<input id="km-awal" name="kmAwal" type="number" min="0" step="0.1" required inputmode="decimal" readonly placeholder="Pilih mobil terlebih dahulu"></label>
      <small id="km-hint">Pilih mobil untuk mengisi KM Awal.</small>
      <button id="submit" type="submit">Kirim Pengajuan</button>
    </form>
    <form class="card" id="return-form" hidden>
      <div id="return-choice-wrap" hidden>
        <label>Pilih pengajuan yang dikembalikan<select id="return-choice"></select></label>
      </div>
      <input type="hidden" name="requestId" id="return-request-id">
      <label>ID Pengajuan<input id="return-id-display" readonly></label>
      <label>Nama pemohon<input id="return-name-display" readonly></label>
      <div class="grid">
        <label>Tanggal mulai<input id="return-start-date" readonly></label>
        <label>Jam mulai<input id="return-start-time" readonly></label>
      </div>
      <label>Tujuan<input id="return-destination" readonly></label>
      <label>Keperluan<textarea id="return-purpose" readonly></textarea></label>
      <label>Mobil<input id="return-car" readonly></label>
      <label>KM Awal<input id="return-km-awal" readonly></label>
      <div class="grid">
        <label>Tanggal selesai<input name="endDate" type="date" required></label>
        <label>Jam selesai<input name="endTime" type="time" required></label>
      </div>
      <label>KM Akhir<input name="kmAkhir" type="number" min="0" step="0.1" required inputmode="decimal" placeholder="Masukkan angka odometer saat kendaraan kembali"></label>
      <button id="return-submit" type="submit">Kirim Pengembalian</button>
    </form>
    <section class="card" id="state-card" hidden><p id="state-message"></p></section>
    <p id="message" role="status" aria-live="polite"></p>
    <iframe name="submit-target" id="submit-target" title="Pengiriman form" hidden></iframe>
    <form id="transport" method="post" enctype="application/x-www-form-urlencoded" target="submit-target" hidden>
      <input name="telegramMiniAppAction" value="submitRequest">
      <input name="initData" id="init-data">
      <input name="formData" id="form-data">
      <input name="nonce" id="request-nonce">
    </form>
  </main>
  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzEivuD5APPDwc_rIXIxd2I048XQL2banfxV3aohBBWcI13No9G3F1VNBszJ9pFibnLpw/exec';
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const requestForm = document.getElementById('request-form');
    const returnForm = document.getElementById('return-form');
    const stateCard = document.getElementById('state-card');
    const stateMessage = document.getElementById('state-message');
    const message = document.getElementById('message');
    const transport = document.getElementById('transport');
    const iframe = document.getElementById('submit-target');
    const carSelect = document.getElementById('car');
    const kmAwalInput = document.getElementById('km-awal');
    const kmHint = document.getElementById('km-hint');
    const actionInput = transport.elements.telegramMiniAppAction;
    const initDataInput = document.getElementById('init-data');
    const formDataInput = document.getElementById('form-data');
    const nonceInput = document.getElementById('request-nonce');
    const returnChoice = document.getElementById('return-choice');
    const returnRequests = [];
    transport.action = APPS_SCRIPT_URL;
    let submissionPending = false;
    let pendingButton = null;
    let flowNonce = '';
    let flowTimer = null;
    let flowPending = false;

    iframe.addEventListener('load', () => {
      if (flowPending) {
        flowPending = false;
        pollFlowResult(flowNonce, 0);
      }
      if (!submissionPending) return;
      submissionPending = false;
      showMessage('Permintaan sudah diteruskan. Periksa grup untuk memastikan proses berhasil atau melihat alasan jika gagal.');
      if (pendingButton) {
        pendingButton.disabled = true;
        pendingButton.textContent = 'Terkirim';
      }
      if (tg) setTimeout(() => tg.close(), 2200);
    });

    function showMessage(text, isError, isSuccess) {
      message.textContent = text || '';
      message.className = isError ? 'error' : (isSuccess ? 'success' : '');
    }
    function showState(text, isError) {
      requestForm.hidden = true;
      returnForm.hidden = true;
      stateCard.hidden = false;
      stateMessage.textContent = text;
      stateMessage.style.color = isError ? '#d23f31' : '';
    }
    function newNonce() {
      if (window.crypto && window.crypto.getRandomValues) {
        return Array.from(window.crypto.getRandomValues(new Uint8Array(16)), byte =>
          byte.toString(16).padStart(2, '0')).join('');
      }
      return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 14);
    }
    function postToBackend(action, data) {
      actionInput.value = action;
      initDataInput.value = tg.initData;
      formDataInput.value = JSON.stringify(data || {});
      nonceInput.value = newNonce();
      transport.submit();
    }
    function loadUserFlow() {
      if (!tg || !tg.initData || !tg.initDataUnsafe || !tg.initDataUnsafe.user) {
        showState('Data akun Telegram tidak diterima. Tutup Mini App, lalu buka kembali melalui tombol menu bot di Telegram.', true);
        return;
      }
      flowNonce = newNonce();
      flowPending = true;
      actionInput.value = 'getMyFlow';
      initDataInput.value = tg.initData;
      formDataInput.value = '';
      nonceInput.value = flowNonce;
      stateCard.hidden = false;
      stateMessage.textContent = 'Memeriksa status pengajuan…';
      transport.submit();
      flowTimer = setTimeout(() => showState('Pemeriksaan status terlalu lama. Tutup Mini App dan coba buka kembali.', true), 15000);
    }
    function pollFlowResult(nonce, attempt) {
      const callbackName = 'onFlowResult_' + Date.now() + '_' + attempt;
      const script = document.createElement('script');
      let finished = false;
      const cleanup = () => {
        if (finished) return;
        finished = true;
        delete window[callbackName];
        script.remove();
      };
      const retryOrFail = () => {
        cleanup();
        if (nonce !== flowNonce) return;
        if (attempt < 4) {
          setTimeout(() => pollFlowResult(nonce, attempt + 1), 450 * (attempt + 1));
        } else {
          clearTimeout(flowTimer);
          showState('Permintaan status tidak ditemukan di Apps Script. Pastikan Code.gs terbaru sudah di-deploy dan URL /exec di index.html menunjuk ke deployment itu.', true);
        }
      };
      window[callbackName] = response => {
        cleanup();
        if (nonce !== flowNonce) return;
        if (!response || !response.ready) {
          retryOrFail();
          return;
        }
        clearTimeout(flowTimer);
        if (!response.result || !response.result.ok) {
          showState(response.result && response.result.error ? response.result.error : 'Status pengajuan tidak dapat dimuat.', true);
          return;
        }
        renderFlow(response.result.flow || { mode: 'request' });
      };
      script.onerror = retryOrFail;
      script.src = APPS_SCRIPT_URL + '?action=flowResult&nonce=' + encodeURIComponent(nonce) +
        '&callback=' + encodeURIComponent('window.' + callbackName) + '&_=' + Date.now();
      document.head.appendChild(script);
    }
    function renderFlow(flow) {
      stateCard.hidden = true;
      if (flow.mode === 'pending') {
        const items = flow.requests || [];
        showState(items.length === 1
          ? 'Pengajuan ' + items[0].requestId + ' masih menunggu persetujuan. Tombol pengajuan baru akan tersedia setelah keputusan diberikan.'
          : 'Anda memiliki pengajuan yang masih menunggu persetujuan. Pengajuan baru belum dapat dibuat.', false);
        return;
      }
      if (flow.mode === 'error') {
        showState(flow.message || 'Status pengajuan belum dapat diproses. Hubungi pengelola.', true);
        return;
      }
      if (flow.mode === 'return' && flow.requests && flow.requests.length) {
        document.getElementById('page-title').textContent = 'Pengembalian Mobil';
        document.getElementById('page-intro').textContent = 'Data perjalanan ditampilkan dari pengajuan yang disetujui. Isi hanya tanggal selesai, jam selesai, dan KM Akhir.';
        requestForm.hidden = true;
        returnForm.hidden = false;
        returnRequests.splice(0, returnRequests.length, ...flow.requests);
        const choiceWrap = document.getElementById('return-choice-wrap');
        returnChoice.innerHTML = '';
        if (returnRequests.length > 1) {
          choiceWrap.hidden = false;
          returnRequests.forEach((item, index) => returnChoice.add(new Option(item.requestId + ' — ' + item.car, String(index))));
          returnChoice.addEventListener('change', () => fillReturnDetails(returnRequests[Number(returnChoice.value)]));
        } else {
          choiceWrap.hidden = true;
        }
        fillReturnDetails(returnRequests[0]);
        wireFormSubmit(returnForm, document.getElementById('return-submit'), 'submitReturn');
        return;
      }
      document.getElementById('page-title').textContent = 'Pengajuan Pemakaian Mobil';
      document.getElementById('page-intro').textContent = 'Isi data perjalanan, lalu periksa sebelum dikirim untuk persetujuan.';
      requestForm.hidden = false;
      returnForm.hidden = true;
      wireFormSubmit(requestForm, document.getElementById('submit'), 'submitRequest');
      loadAvailableCars();
    }
    function wireFormSubmit(formElement, buttonElement, action) {
      if (formElement.dataset.submitWired === 'true') return;
      formElement.dataset.submitWired = 'true';
      // Handle the visible button directly so Telegram WebView gives clear
      // feedback when any required field has not been completed.
      buttonElement.type = 'button';
      const submit = event => {
        event.preventDefault();
        if (!formElement.reportValidity()) {
          showMessage('Mohon lengkapi semua kolom wajib sebelum mengirim.', true);
          return;
        }
        submitForm(event, formElement, buttonElement, action);
      };
      buttonElement.addEventListener('click', submit);
      formElement.addEventListener('submit', submit);
    }
    function fillReturnDetails(item) {
      if (!item) return;
      document.getElementById('return-request-id').value = item.requestId;
      document.getElementById('return-id-display').value = item.requestId;
      document.getElementById('return-name-display').value = item.name;
      document.getElementById('return-start-date').value = item.startDate;
      document.getElementById('return-start-time').value = item.startTime;
      document.getElementById('return-destination').value = item.destination;
      document.getElementById('return-purpose').value = item.purpose;
      document.getElementById('return-car').value = item.car;
      document.getElementById('return-km-awal').value = item.kmAwal;
    }
    function submitForm(event, formElement, buttonElement, action) {
      event.preventDefault();
      if (!tg || !tg.initData || !tg.initDataUnsafe || !tg.initDataUnsafe.user) {
        showMessage('Data Telegram tidak tersedia. Tutup Mini App lalu buka kembali dari tombol menu.', true);
        return;
      }
      buttonElement.disabled = true;
      buttonElement.textContent = 'Mengirim…';
      pendingButton = buttonElement;
      showMessage('');
      submissionPending = true;
      postToBackend(action, Object.fromEntries(new FormData(formElement).entries()));
      setTimeout(() => {
        if (!submissionPending) return;
        submissionPending = false;
        buttonElement.disabled = false;
        buttonElement.textContent = action === 'submitReturn' ? 'Kirim Pengembalian' : 'Kirim Pengajuan';
        showMessage('Belum ada konfirmasi dari server. Periksa grup sebelum mencoba lagi agar data tidak terkirim dua kali.', true);
      }, 15000);
    }

    const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ||
      (tg && tg.initData ? new URLSearchParams(tg.initData).get('start_param') : '');
    if (!['flow', 'group', 'private', 'return'].includes(startParam)) {
      showState('Buka Mini App melalui tombol “🚗 Pengajuan / Pengembalian” di menu bot.', true);
    } else {
      loadUserFlow();
    }

    function loadAvailableCars() {
      const callbackName = 'onCarList_' + Date.now();
      const script = document.createElement('script');
      window[callbackName] = result => {
        delete window[callbackName]; script.remove(); carSelect.innerHTML = '';
        if (!result || !result.ok || !result.cars || !result.cars.length) {
          carSelect.disabled = true;
          carSelect.add(new Option('Daftar mobil tidak tersedia', ''));
          showMessage(result && result.error ? result.error : 'Belum ada mobil aktif pada tab DAFTAR_MOBIL.', true);
          return;
        }
        const placeholder = new Option('Pilih mobil dan plat nomor', '', true, true);
        placeholder.disabled = true; carSelect.add(placeholder);
        result.cars.forEach(car => {
          const option = new Option(car.label, car.value);
          option.dataset.kmAwal = car.kmAwal === null || car.kmAwal === undefined ? '' : String(car.kmAwal);
          carSelect.add(option);
        });
        carSelect.disabled = false;
      };
      script.onerror = () => {
        delete window[callbackName]; script.remove(); carSelect.disabled = true;
        carSelect.innerHTML = ''; carSelect.add(new Option('Daftar mobil gagal dimuat', ''));
        showMessage('Tidak dapat mengambil daftar mobil dari Apps Script. Periksa deployment backend.', true);
      };
      script.src = APPS_SCRIPT_URL + '?action=listCars&callback=' + encodeURIComponent('window.' + callbackName) + '&_=' + Date.now();
      document.head.appendChild(script);
    }
    carSelect.addEventListener('change', () => {
      const option = carSelect.selectedOptions[0];
      const lastKm = option && option.dataset.kmAwal;
      if (lastKm !== undefined && lastKm !== '') {
        kmAwalInput.value = lastKm; kmAwalInput.readOnly = true;
        kmHint.textContent = 'Terisi otomatis dari KM Akhir terakhir mobil ini.';
      } else {
        kmAwalInput.value = ''; kmAwalInput.readOnly = false;
        kmAwalInput.placeholder = 'Masukkan KM Awal pertama mobil ini';
        kmHint.textContent = 'Belum ada KM Akhir tercatat untuk mobil ini. Isi KM Awal secara manual satu kali.';
      }
    });
  </script>
</body>
</html>
